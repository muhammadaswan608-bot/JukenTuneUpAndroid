name: Build Juken Tune Up APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e
          ZIP_FILE="JukenTuneUpAndroid-starter.zip"
          test -f "$ZIP_FILE" || {
            echo "File ZIP proyek tidak ditemukan"
            exit 1
          }
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          if [ -f extracted/settings.gradle.kts ]; then
            cp -R extracted/. .
          else
            ROOT="$(find extracted -name settings.gradle.kts -print -quit)"
            test -n "$ROOT"
            DIR="$(dirname "$ROOT")"
            cp -R "$DIR"/. .
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JukenTuneUp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
